<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ジングルとSEの候補 — PRISM NOTES</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#090d1a;color:#edf1fa}body{margin:0;height:100dvh;overflow:hidden}main{max-width:820px;height:100%;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:10px}h1{font-size:22px;color:#ddbd72;margin:0 0 4px}p{margin:0;line-height:1.5;font-size:13px;color:#b9c7dd}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{font:inherit;font-size:13px;min-height:42px;padding:7px;border:1px solid #53647d;border-radius:10px;background:#172137;color:#edf1fa}button[aria-pressed=true]{background:#d4b365;color:#13192a;border-color:#f4d58d}#mode{display:flex;gap:7px;align-items:center;justify-content:space-between}#mode p{flex:1}#mode button{flex-shrink:0}#cards{overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:9px}article{padding:12px;border:1px solid #53647d;border-radius:13px;background:#111b2e}h2{font-size:16px;margin:0 0 4px}h2 b{color:#ddbd72;margin-right:7px}article p{font-size:12px;margin-bottom:6px}small{font-size:11px;color:#edce8a;margin-left:6px}audio{display:block;width:100%;height:42px}footer{font-size:11px;color:#a8b7cf;line-height:1.5}a{color:#e6c67f}#overview{margin-top:4px}#overview a{margin-right:12px}@media(min-width:680px){#cards{display:grid;grid-template-columns:repeat(3,1fr);align-content:start}article{padding:15px}h1{font-size:27px}nav{grid-template-columns:repeat(6,1fr)}article p{min-height:45px}}@media(max-height:540px){main{gap:5px;padding-top:6px;padding-bottom:5px}h1{font-size:18px}p{font-size:11px}nav button{min-height:35px;padding:4px}article{padding:9px}#mode button{min-height:32px}footer{font-size:10px}}
</style><main>
<header><h1>ジングルとSEの候補</h1><p>それぞれ3案。鐘の音色は採用済みのままです。本体へはまだ反映していません。</p></header>
<nav aria-label="音の種類"></nav><section id="mode"><p id="description"></p><button id="context" aria-pressed="true">鐘のあと</button></section>
<section id="cards" aria-label="3つの候補"></section>
<footer><div>おすすめは各1案目。種類ごとに別の番号を選べます。</div><div id="overview"></div>試聴 v2026.10.17-1 · © SIKUMI LAB</footer>
</main><script>
const version="2026.10.17-1",groups=[{"id":"perfect","title":"100点のファンファーレ","prefix":"F","context":true,"description":"短いブラスの祝福。鐘のあと0.7秒から始まり、2.7秒の操作復帰に収めます。"},{"id":"clear","title":"通常クリア","prefix":"C","context":true,"description":"達成を穏やかに知らせる短い音楽。100点のファンファーレと差を付けます。"},{"id":"failure","title":"未達成","prefix":"N","context":true,"description":"再挑戦を促す控えめな下降形。鐘のあと1.5秒から始まります。"},{"id":"tap","title":"操作ボタン","prefix":"T","description":"短く、繰り返し押しても邪魔になりにくい音。"},{"id":"wire","title":"結線できたとき","prefix":"W","description":"つながったことを知らせる小さな上向きの音。"},{"id":"relay","title":"プリズム到着","prefix":"R","description":"到着1回につき1回だけ鳴る、短い「ピコン」の方向。"}],candidates=[{"id":"F1","group":"perfect","name":"王道の祝福","description":"短い同音の呼びかけから、明るいブラスの和音へ。","recommended":true},{"id":"F2","group":"perfect","name":"星の祝祭","description":"上へ駆け上がるブラスに、明るい鍵盤を重ねた華やかな案。"},{"id":"F3","group":"perfect","name":"夜空の凱歌","description":"少し落ち着いたブラスと弦の和音。堂々とした祝福。"},{"id":"C1","group":"clear","name":"小さな達成","description":"柔らかなエレピで、上向きに短く解決。","recommended":true},{"id":"C2","group":"clear","name":"光のマレット","description":"澄んだ打鍵音で軽やかに。鐘より短く、明るく。"},{"id":"C3","group":"clear","name":"やわらかな余韻","description":"鍵盤の合図から、穏やかな弦の和音へ。"},{"id":"N1","group":"failure","name":"もう一歩","description":"丸い音で静かに下がる。強く責めない案。","recommended":true},{"id":"N2","group":"failure","name":"鍵盤のため息","description":"エレピの下降3音。結果が伝わる、少し明確な案。"},{"id":"N3","group":"failure","name":"夜の小さな陰り","description":"短い弦の和音を下へ。落ち着いた再挑戦の合図。"},{"id":"T1","group":"tap","name":"丸いタッチ","description":"控えめで丸い、短い1音。","recommended":true},{"id":"T2","group":"tap","name":"澄んだタッチ","description":"小さな打鍵の輪郭がある1音。"},{"id":"T3","group":"tap","name":"軽いタッチ","description":"乾いたエレピを小さく鳴らす1音。"},{"id":"W1","group":"wire","name":"つながる2音","description":"丸い2音で、つながったことを知らせる。","recommended":true},{"id":"W2","group":"wire","name":"光る接点","description":"高めの打鍵音が短く上へ。"},{"id":"W3","group":"wire","name":"軽いはめ込み","description":"エレピの2音。操作音より明るい到達感。"},{"id":"R1","group":"relay","name":"丸いピコン","description":"重なりを抑えた、柔らかな2音の到着合図。","recommended":true},{"id":"R2","group":"relay","name":"光片のきらめき","description":"短い打鍵音で、プリズムの輝きを表す。"},{"id":"R3","group":"relay","name":"鍵盤のピコン","description":"少し低めのエレピ。操作・結線の音と区別する。"}];
let current='perfect',withBell=true;
const stopAll=()=>{for(const a of document.querySelectorAll('audio')){a.pause();a.currentTime=0;}};
const nav=document.querySelector('nav');for(const group of groups){const button=document.createElement('button');button.textContent=group.title;button.dataset.group=group.id;button.onclick=()=>{stopAll();current=group.id;render();};nav.append(button);}
function render(){const group=groups.find(g=>g.id===current),cards=document.getElementById('cards');for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.group===current));document.getElementById('description').textContent=group.description;const mode=document.getElementById('context');mode.hidden=!group.context;mode.textContent=withBell?'鐘のあと':'単独';mode.setAttribute('aria-pressed',String(withBell));cards.replaceChildren();for(const item of candidates.filter(c=>c.group===current)){const card=document.createElement('article'),heading=document.createElement('h2'),id=document.createElement('b'),description=document.createElement('p'),audio=document.createElement('audio');id.textContent=item.id;heading.append(id,document.createTextNode(item.name));if(item.recommended){const badge=document.createElement('small');badge.textContent='おすすめ';heading.append(badge);}description.textContent=item.description;audio.controls=true;audio.preload='metadata';audio.src='./audio/'+item.id+(group.context&&withBell?'-context':'')+'.wav?v='+version;audio.setAttribute('aria-label',item.id+' '+item.name);audio.onplay=()=>{for(const other of document.querySelectorAll('audio'))if(other!==audio){other.pause();other.currentTime=0;}};card.append(heading,description,audio);cards.append(card);}const overview=document.getElementById('overview');overview.replaceChildren();const link=document.createElement('a');link.href='./audio/'+current+'-comparison.wav?v='+version;link.textContent='1→2→3を続けて聴く';link.download=current+'-comparison.wav';overview.append(link);cards.scrollTop=0;}
document.getElementById('context').onclick=()=>{stopAll();withBell=!withBell;render();};document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll();});render();
</script></html>
