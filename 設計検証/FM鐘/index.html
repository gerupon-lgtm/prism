<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鐘の音の調整 — PRISM NOTES</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#090d1a;color:#edf1fa}
  body{box-sizing:border-box;max-width:540px;margin:auto;padding:24px 18px}
  h1{font-size:24px;color:#ddbd72;margin:0 0 12px}p{line-height:1.7;margin:0 0 18px;color:#bcc8dd}
  article{padding:14px 16px;margin-bottom:14px;border:1px solid #53647d;border-radius:14px;background:#121b2d}
  h2{font-size:18px;margin:0 0 10px}audio{display:block;width:100%;height:48px}
  footer{font-size:12px;line-height:1.7;color:#a8b7cf}
</style>
<h1>鐘の音の調整</h1>
<p>元の3種類を基に、約2.6秒で静かに消える長さに調整しました。同じアプリ内音量70%での比較です。</p>
<article><h2>小さなベル・高め</h2><audio controls preload="none" src="./small.wav?v=2026.10.16-1"></audio></article>
<article><h2>チャイム・単音</h2><audio controls preload="none" src="./chime.wav?v=2026.10.16-1"></audio></article>
<article><h2>大きな鐘・低め</h2><audio controls preload="none" src="./large.wav?v=2026.10.16-1"></audio></article>
<footer>比較用の調整版。採用する音を選ぶ前の試聴資料です。<br>© SIKUMI LAB · FM鐘調整 v2026.10.16-1</footer>
<script>
  for(const audio of document.querySelectorAll('audio'))audio.addEventListener('play',()=>{
    for(const other of document.querySelectorAll('audio'))if(other!==audio){other.pause();other.currentTime=0;}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)for(const audio of document.querySelectorAll('audio')){audio.pause();audio.currentTime=0;}});
</script>
</html>
