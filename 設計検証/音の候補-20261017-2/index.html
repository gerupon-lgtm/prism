<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ジングルとSEの候補 — PRISM NOTES</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#090d1a;color:#edf1fa}body{margin:0;height:100dvh;overflow:hidden}main{max-width:820px;height:100%;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:10px}h1{font-size:22px;color:#ddbd72;margin:0 0 4px}p{margin:0;line-height:1.5;font-size:13px;color:#b9c7dd}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{font:inherit;font-size:13px;min-height:42px;padding:7px;border:1px solid #53647d;border-radius:10px;background:#172137;color:#edf1fa}button[aria-pressed=true]{background:#d4b365;color:#13192a;border-color:#f4d58d}#mode{display:flex;gap:7px;align-items:center;justify-content:space-between}#mode p{flex:1}#mode button{flex-shrink:0}#cards{overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:9px}article{padding:12px;border:1px solid #53647d;border-radius:13px;background:#111b2e}h2{font-size:16px;margin:0 0 4px}h2 b{color:#ddbd72;margin-right:7px}article p{font-size:12px;margin-bottom:6px}small{font-size:11px;color:#edce8a;margin-left:6px}audio{display:block;width:100%;height:42px}footer{font-size:11px;color:#a8b7cf;line-height:1.5}a{color:#e6c67f}#overview{margin-top:4px}#overview a{margin-right:12px}@media(min-width:680px){#cards{display:grid;grid-template-columns:repeat(3,1fr);align-content:start}article{padding:15px}h1{font-size:27px}nav{grid-template-columns:repeat(6,1fr)}article p{min-height:45px}}@media(max-height:540px){main{gap:5px;padding-top:6px;padding-bottom:5px}h1{font-size:18px}p{font-size:11px}nav button{min-height:35px;padding:4px}article{padding:9px}#mode button{min-height:32px}footer{font-size:10px}}
</style><main>
<header><h1>ジングルとSEの候補</h1><p>それぞれ3案。鐘の音色は採用済みのままです。本体へはまだ反映していません。</p></header>
<nav aria-label="音の種類"></nav><section id="mode"><p id="description"></p><button id="context" aria-pressed="true">鐘のあと</button></section>
<section id="cards" aria-label="3つの候補"></section>
<footer><div>おすすめは各種類の最初の案。種類ごとに別の番号を選べます。</div><div id="overview"></div>試聴 v2026.10.17-2 · © SIKUMI LAB</footer>
</main><script>
const version="2026.10.17-2",groups=[{"id":"perfect","title":"100点ファンファーレ","prefix":"F","context":true,"description":"ブラス＋Strings。弾むリズムと明るい旋律で祝福する3案です。"},{"id":"relay","title":"プリズム到着","prefix":"R","description":"採用済みの操作T2・結線W2と重ならない音の高さにした3案です。"}],candidates=[{"id":"F4","group":"perfect","name":"はずむ祝福","description":"上へ跳ねるブラスと、リズムを添える弦。","recommended":true},{"id":"F5","group":"perfect","name":"星たちのパレード","description":"ブラスとStringsの掛け合い。高音へ駆け上がる楽しい案。"},{"id":"F6","group":"perfect","name":"小さな凱旋","description":"短く歯切れよいブラスと、明るく動く弦の和音。"},{"id":"R4","group":"relay","name":"低めの結晶","description":"操作・結線より十分低い、透明な1音。","recommended":true},{"id":"R5","group":"relay","name":"中音のピコン","description":"高い操作音と区別する、丸いエレピの1音。"},{"id":"R6","group":"relay","name":"跳ねる到着","description":"操作・結線と重ならない高さで、1オクターブ跳ねる短音。"}];
let current='perfect',withBell=true;
const stopAll=()=>{for(const a of document.querySelectorAll('audio')){a.pause();a.currentTime=0;}};
const nav=document.querySelector('nav');for(const group of groups){const button=document.createElement('button');button.textContent=group.title;button.dataset.group=group.id;button.onclick=()=>{stopAll();current=group.id;render();};nav.append(button);}
function render(){const group=groups.find(g=>g.id===current),cards=document.getElementById('cards');for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.group===current));document.getElementById('description').textContent=group.description;const mode=document.getElementById('context');mode.hidden=!group.context;mode.textContent=withBell?'鐘のあと':'単独';mode.setAttribute('aria-pressed',String(withBell));cards.replaceChildren();for(const item of candidates.filter(c=>c.group===current)){const card=document.createElement('article'),heading=document.createElement('h2'),id=document.createElement('b'),description=document.createElement('p'),audio=document.createElement('audio');id.textContent=item.id;heading.append(id,document.createTextNode(item.name));if(item.recommended){const badge=document.createElement('small');badge.textContent='おすすめ';heading.append(badge);}description.textContent=item.description;audio.controls=true;audio.preload='metadata';audio.src='./audio/'+item.id+(group.context&&withBell?'-context':'')+'.wav?v='+version;audio.setAttribute('aria-label',item.id+' '+item.name);audio.onplay=()=>{for(const other of document.querySelectorAll('audio'))if(other!==audio){other.pause();other.currentTime=0;}};card.append(heading,description,audio);cards.append(card);}const overview=document.getElementById('overview');overview.replaceChildren();const link=document.createElement('a');link.href='./audio/'+current+'-comparison.wav?v='+version;link.textContent=candidates.filter(c=>c.group===current).map(c=>c.id).join('→')+'を続けて聴く';link.download=current+'-comparison.wav';overview.append(link);cards.scrollTop=0;}
document.getElementById('context').onclick=()=>{stopAll();withBell=!withBell;render();};document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll();});render();
</script></html>
